name: Release APK to GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'AutoPay Alert v1.0.0'
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        default: 'Production-ready release: Real-time Bank SMS parsing, recurring payment detection, upcoming reminders with regional voice alerts, and on-device Fraud Shield.'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Keystore & Environment Secrets
        run: |
          touch .env
          echo "# AutoPay Alert Environment" > .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g"

      - name: Prepare Release Asset
        id: prepare_asset
        run: |
          mkdir -p release-output
          TAG="${{ github.event.inputs.version_tag || github.ref_name || 'v1.0.0' }}"
          APK_NAME="AutoPayAlert-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/${APK_NAME}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_path=release-output/${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_asset.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.prepare_asset.outputs.tag }}
          body: ${{ github.event.inputs.release_notes || 'Automated release with verified on-device money tracker APK.' }}
          draft: false
          prerelease: false
          files: ${{ steps.prepare_asset.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
